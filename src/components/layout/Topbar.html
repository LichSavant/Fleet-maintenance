<header class="topbar">
  <button
    class="icon-button mobile-menu"
    id="menu-toggle"
    type="button"
    aria-label="Open navigation"
    aria-controls="sidebar"
    aria-expanded="false"
  >
    ☰
  </button>
  <form class="topbar-search" id="topbar-search" role="search">
    <label class="sr-only" for="global-search">Search ForgeFleet</label
    ><input
      id="global-search"
      name="query"
      type="search"
      placeholder="Search fleet, people, maintenance"
      autocomplete="off"
    /><button type="submit" aria-label="Search">⌕</button>
  </form>
  <div class="topbar-actions">
    <a
      class="icon-button notification-link"
      data-shared-link="notifications.html"
      aria-label="Notifications"
      >♢<span class="notification-count" data-notification-count>0</span></a
    ><button
      class="profile-trigger"
      id="profile-trigger"
      type="button"
      aria-expanded="false"
      aria-controls="profile-menu"
    >
      <span class="avatar" data-avatar>FF</span
      ><span class="profile-copy"
        ><strong data-user-name>Demo User</strong
        ><small data-user-role>Role</small></span
      ><span aria-hidden="true">⌄</span>
    </button>
    <div class="dropdown" id="profile-menu" hidden>
      <a data-shared-link="profile.html">Profile</a
      ><button id="profile-logout" type="button">Sign out</button>
    </div>
  </div>
</header>
