<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ForgeFleet</title>
    <script>
      try {
        const s = JSON.parse(
            sessionStorage.getItem("forgefleet_session") || "null",
          ),
          p = s ? `${s.role}/dashboard.html` : "login.html";
        location.replace(p);
      } catch (e) {
        location.replace("login.html");
      }
    </script>
  </head>
  <body>
    <p>Opening ForgeFleet… <a href="login.html">Continue to sign in</a>.</p>
  </body>
</html>
