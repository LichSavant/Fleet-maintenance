<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot password · ForgeFleet</title>
    <link rel="stylesheet" href="src/styles/variables.css" />
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/pages/auth.css" />
  </head>
  <body data-public="true">
    <main class="auth-page">
      <section class="auth-hero">
        <img src="src/assets/images/forgefleet-hero.png" alt="" />
        <div class="auth-hero-copy">
          <p class="eyebrow">Account recovery</p>
          <h1>Return to fleet control.</h1>
        </div>
      </section>
      <section class="auth-panel">
        <div class="auth-card">
          <div class="auth-brand">
            <span class="brand-mark">◆</span><strong>ForgeFleet</strong>
          </div>
          <p class="eyebrow">Frontend demonstration</p>
          <h2>Forgot your password?</h2>
          <p class="muted">
            Enter an email to demonstrate the recovery request.
          </p>
          <form class="auth-form" id="forgot-form" novalidate>
            <div class="field">
              <label for="email">Email address</label
              ><input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
              /><span class="field-error" data-error-for="email"></span>
            </div>
            <p class="auth-message" id="forgot-message" role="status"></p>
            <button class="button button-primary button-block">
              Request instructions</button
            ><a class="button button-ghost button-block" href="login.html"
              >Return to Sign In</a
            ><a class="button button-ghost button-block" href="signup.html"
              >Create Account</a
            >
          </form>
        </div>
      </section>
    </main>
    <script src="src/utils/validation.js"></script>
    <script src="src/scripts/pages/forgotPassword.js"></script>
  </body>
</html>
