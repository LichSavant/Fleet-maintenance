<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page not found · ForgeFleet</title>
    <link rel="stylesheet" href="src/styles/variables.css" />
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/pages/auth.css" />
  </head>
  <body>
    <main class="auth-panel">
      <section class="auth-card card">
        <p class="eyebrow">Error 404</p>
        <h1>Route not found.</h1>
        <p class="muted mb-4">
          This page is outside the current ForgeFleet route map.
        </p>
        <a class="button button-primary" id="return-dashboard" href="login.html"
          >Return to ForgeFleet</a
        >
      </section>
    </main>
    <script>
      const s = JSON.parse(
        sessionStorage.getItem("forgefleet_session") || "null",
      );
      if (s)
        document.getElementById("return-dashboard").href =
          s.role + "/dashboard.html";
    </script>
  </body>
</html>
